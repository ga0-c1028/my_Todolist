<svg width="1280" height="480" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Segoe UI',Arial,sans-serif">
  <!-- ===== 실제 구현 화면(로그인 후 /todos, 1280px 데스크톱) 기준 재현 ===== -->
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Consolas',monospace; }
      .w800 { font-weight: 800; }
      .w700 { font-weight: 700; }
      .w500 { font-weight: 500; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="480" fill="#FAF6EE"/>

  <!-- ===== 헤더 ===== -->
  <rect x="0" y="0" width="1280" height="64" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="24" y="38" fill="#111111" class="w800" font-size="20">my_Todolist</text>

  <text x="168" y="30" fill="#F03A9B" class="mono w500" font-size="14">할일 목록</text>
  <rect x="168" y="36" width="60" height="2" fill="#F03A9B"/>
  <text x="256" y="30" fill="#111111" class="mono w500" font-size="14">카테고리 관리</text>
  <text x="372" y="30" fill="#111111" class="mono w500" font-size="14">회원 정보</text>

  <text x="1256" y="30" text-anchor="end" fill="#111111" class="w700" font-size="14">시드유저 ▾</text>

  <!-- ===== 필터 바 + 등록 버튼 (한 줄) ===== -->
  <text x="184" y="110" fill="#111111" class="w500" font-size="14">카테고리:</text>
  <rect x="248" y="92" width="74" height="26" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="258" y="109" fill="#111111" class="mono" font-size="12">전체 ▾</text>

  <text x="358" y="110" fill="#111111" class="w500" font-size="14">상태:</text>

  <rect x="386" y="92" width="56" height="26" rx="13" fill="#111111"/>
  <text x="414" y="109" text-anchor="middle" fill="#FFFFFF" class="mono w500" font-size="12">전체</text>

  <rect x="450" y="92" width="76" height="26" rx="13" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="488" y="109" text-anchor="middle" fill="#111111" class="mono w500" font-size="12">시작 전</text>

  <rect x="534" y="92" width="76" height="26" rx="13" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="572" y="109" text-anchor="middle" fill="#111111" class="mono w500" font-size="12">진행중</text>

  <rect x="618" y="92" width="56" height="26" rx="13" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="646" y="109" text-anchor="middle" fill="#111111" class="mono w500" font-size="12">완료</text>

  <rect x="682" y="92" width="76" height="26" rx="13" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="720" y="109" text-anchor="middle" fill="#111111" class="mono w500" font-size="12">기한초과</text>

  <rect x="984" y="88" width="112" height="34" rx="8" fill="#111111"/>
  <text x="1040" y="110" text-anchor="middle" fill="#FFFFFF" class="w700" font-size="14">+ 할일 등록</text>

  <!-- ===== 할일 카드 (공통: x=184, width=912, height=56, rx=8, border 2px ink, fill surface) ===== -->

  <!-- 카드 1: 기한초과 -->
  <g>
    <rect x="184" y="150" width="912" height="56" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="200" y="166" width="20" height="20" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="238" y="182" fill="#111111" class="w700" font-size="16">(시드) 기한초과 할일</text>
    <rect x="392" y="169" width="46" height="20" rx="10" fill="none" stroke="#111111" stroke-width="1"/>
    <text x="415" y="183" text-anchor="middle" fill="#111111" class="w500" font-size="11">기본</text>
    <rect x="446" y="167" width="66" height="22" rx="11" fill="#E5484D"/>
    <text x="479" y="182" text-anchor="middle" fill="#FFFFFF" class="mono w500" font-size="11">기한초과</text>
    <text x="238" y="200" fill="#6B6558" class="mono" font-size="12">2026-08-17 ~ 2026-08-24</text>
    <text x="1000" y="182" fill="#111111" class="w700" font-size="14" text-decoration="underline">수정</text>
    <text x="1044" y="182" fill="#E5484D" class="w700" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 2: 완료 (체크됨, 제목 취소선) -->
  <g>
    <rect x="184" y="222" width="912" height="56" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="200" y="238" width="20" height="20" rx="4" fill="#111111"/>
    <path d="M 204 248 L 209 253 L 217 242" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="238" y="254" fill="#111111" class="w700" font-size="16" text-decoration="line-through">(시드) 완료된 할일</text>
    <rect x="382" y="241" width="46" height="20" rx="10" fill="none" stroke="#111111" stroke-width="1"/>
    <text x="405" y="255" text-anchor="middle" fill="#111111" class="w500" font-size="11">기본</text>
    <rect x="436" y="239" width="62" height="22" rx="11" fill="#2E6ADE"/>
    <text x="467" y="254" text-anchor="middle" fill="#FFFFFF" class="mono w500" font-size="11">✓ 완료</text>
    <text x="238" y="272" fill="#6B6558" class="mono" font-size="12">2026-08-22 ~ 2026-08-26</text>
    <text x="1000" y="254" fill="#111111" class="w700" font-size="14" text-decoration="underline">수정</text>
    <text x="1044" y="254" fill="#E5484D" class="w700" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 3: 진행중 -->
  <g>
    <rect x="184" y="294" width="912" height="56" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="200" y="310" width="20" height="20" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="238" y="326" fill="#111111" class="w700" font-size="16">(시드) 진행중 할일</text>
    <rect x="382" y="313" width="46" height="20" rx="10" fill="none" stroke="#111111" stroke-width="1"/>
    <text x="405" y="327" text-anchor="middle" fill="#111111" class="w500" font-size="11">업무</text>
    <rect x="436" y="311" width="58" height="22" rx="11" fill="#F03A9B"/>
    <text x="465" y="326" text-anchor="middle" fill="#FFFFFF" class="mono w500" font-size="11">진행중</text>
    <text x="238" y="344" fill="#6B6558" class="mono" font-size="12">2026-08-25 ~ 2026-09-01</text>
    <text x="1000" y="326" fill="#111111" class="w700" font-size="14" text-decoration="underline">수정</text>
    <text x="1044" y="326" fill="#E5484D" class="w700" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 4: 시작 전 -->
  <g>
    <rect x="184" y="366" width="912" height="56" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="200" y="382" width="20" height="20" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="238" y="398" fill="#111111" class="w700" font-size="16">(시드) 시작 전 할일</text>
    <rect x="386" y="385" width="46" height="20" rx="10" fill="none" stroke="#111111" stroke-width="1"/>
    <text x="409" y="399" text-anchor="middle" fill="#111111" class="w500" font-size="11">업무</text>
    <rect x="440" y="383" width="66" height="22" rx="11" fill="#6B6558"/>
    <text x="473" y="398" text-anchor="middle" fill="#FFFFFF" class="mono w500" font-size="11">시작 전</text>
    <text x="238" y="416" fill="#6B6558" class="mono" font-size="12">2026-09-01 ~ 2026-09-06</text>
    <text x="1000" y="398" fill="#111111" class="w700" font-size="14" text-decoration="underline">수정</text>
    <text x="1044" y="398" fill="#E5484D" class="w700" font-size="14" text-decoration="underline">삭제</text>
  </g>
</svg>
