<svg width="1200" height="920" viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Segoe UI',Arial,sans-serif">
  <!-- ===== 정의: 색상 토큰 (docs/9-style.md 2절) ===== -->
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Consolas',monospace; letter-spacing: 0.05em; }
      .bold900 { font-weight: 900; }
      .bold700 { font-weight: 700; }
      .bold500 { font-weight: 500; }
    </style>
  </defs>

  <!-- ===== 배경: 머스터드 옐로 (color-primary) ===== -->
  <rect x="0" y="0" width="1200" height="920" fill="#F2B705"/>

  <!-- ===== 상단 공통 내비게이션 (와이어프레임 3.1절 + 스타일 4절) ===== -->
  <rect x="0" y="0" width="1200" height="64" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <circle cx="40" cy="32" r="16" fill="#111111"/>
  <text x="40" y="38" text-anchor="middle" fill="#FAF6EE" class="bold900" font-size="16">m</text>
  <text x="68" y="39" fill="#111111" class="bold900" font-size="20">my_Todolist</text>

  <text x="240" y="38" fill="#F03A9B" class="bold700" font-size="16">할일 목록</text>
  <rect x="238" y="46" width="62" height="3" fill="#F03A9B"/>
  <text x="360" y="38" fill="#111111" class="bold500" font-size="16">카테고리 관리</text>
  <text x="500" y="38" fill="#111111" class="bold500" font-size="16">회원 정보</text>

  <text x="1160" y="38" text-anchor="end" fill="#111111" class="bold700" font-size="16">사용자명 ▾</text>

  <!-- ===== 필터 바 ===== -->
  <text x="48" y="110" fill="#111111" class="bold500" font-size="15">카테고리</text>
  <rect x="120" y="90" width="120" height="34" rx="17" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="180" y="112" text-anchor="middle" fill="#111111" class="bold500" font-size="14">전체 ▾</text>

  <text x="270" y="110" fill="#111111" class="bold500" font-size="15">상태</text>

  <!-- 상태 필터 pill 그룹 (선택된 '전체'만 블랙 배경) -->
  <rect x="320" y="90" width="70" height="34" rx="17" fill="#111111"/>
  <text x="355" y="112" text-anchor="middle" fill="#FAF6EE" class="mono bold700" font-size="12">전체</text>

  <rect x="398" y="90" width="90" height="34" rx="17" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="443" y="112" text-anchor="middle" fill="#111111" class="mono bold500" font-size="12">시작 전</text>

  <rect x="496" y="90" width="90" height="34" rx="17" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="541" y="112" text-anchor="middle" fill="#111111" class="mono bold500" font-size="12">진행중</text>

  <rect x="594" y="90" width="80" height="34" rx="17" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="634" y="112" text-anchor="middle" fill="#111111" class="mono bold500" font-size="12">완료</text>

  <rect x="682" y="90" width="100" height="34" rx="17" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
  <text x="732" y="112" text-anchor="middle" fill="#111111" class="mono bold500" font-size="12">기한초과</text>

  <!-- + 할일 등록 버튼 (Primary 버튼, 4절) -->
  <rect x="1000" y="86" width="152" height="42" rx="8" fill="#111111"/>
  <text x="1076" y="113" text-anchor="middle" fill="#FFFFFF" class="bold700" font-size="16">+ 할일 등록</text>

  <!-- ===== 할일 카드 목록 ===== -->
  <!-- 공통 카드 프레임: x=48, width=1104, rx=8, stroke #111111 2px, fill #FAF6EE -->

  <!-- 카드 1: 진행중 -->
  <g>
    <rect x="48" y="160" width="1104" height="104" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="72" y="196" width="24" height="24" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="112" y="200" fill="#111111" class="bold700" font-size="18">데이터베이스 과제 제출(최종본)</text>
    <rect x="112" y="212" width="72" height="22" rx="11" fill="none" stroke="#6B6558" stroke-width="1.5"/>
    <text x="148" y="227" text-anchor="middle" fill="#6B6558" class="bold500" font-size="12">학교 과제</text>
    <text x="112" y="252" fill="#6B6558" class="mono" font-size="13">2026-08-20 ~ 2026-08-30</text>

    <!-- 상태 배지: 진행중 = 핑크(color-accent) -->
    <rect x="960" y="188" width="90" height="28" rx="14" fill="#F03A9B"/>
    <text x="1005" y="207" text-anchor="middle" fill="#FFFFFF" class="mono bold700" font-size="12">진행중</text>

    <text x="1000" y="252" fill="#111111" class="bold500" font-size="14" text-decoration="underline">수정</text>
    <text x="1050" y="252" fill="#E5484D" class="bold500" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 2: 완료 (체크됨, 제목 취소선) -->
  <g>
    <rect x="48" y="284" width="1104" height="104" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="72" y="320" width="24" height="24" rx="4" fill="#111111" stroke="#111111" stroke-width="2"/>
    <path d="M 77 332 L 83 338 L 93 324" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <text x="112" y="324" fill="#6B6558" class="bold700" font-size="18" text-decoration="line-through">팀 회의록 정리</text>
    <rect x="112" y="336" width="52" height="22" rx="11" fill="none" stroke="#6B6558" stroke-width="1.5"/>
    <text x="138" y="351" text-anchor="middle" fill="#6B6558" class="bold500" font-size="12">업무</text>
    <text x="112" y="376" fill="#6B6558" class="mono" font-size="13">2026-08-10 ~ 2026-08-15</text>

    <!-- 상태 배지: 완료 = 블루(color-info) + 체크 아이콘 -->
    <rect x="960" y="312" width="90" height="28" rx="14" fill="#2E6ADE"/>
    <path d="M 977 326 L 982 331 L 990 320" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="1010" y="331" text-anchor="middle" fill="#FFFFFF" class="mono bold700" font-size="12">완료</text>

    <text x="1000" y="376" fill="#111111" class="bold500" font-size="14" text-decoration="underline">수정</text>
    <text x="1050" y="376" fill="#E5484D" class="bold500" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 3: 기한초과 -->
  <g>
    <rect x="48" y="408" width="1104" height="104" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="72" y="444" width="24" height="24" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="112" y="448" fill="#111111" class="bold700" font-size="18">세금계산서 발행</text>
    <rect x="112" y="460" width="48" height="22" rx="11" fill="none" stroke="#6B6558" stroke-width="1.5"/>
    <text x="136" y="475" text-anchor="middle" fill="#6B6558" class="bold500" font-size="12">기본</text>
    <text x="112" y="500" fill="#6B6558" class="mono" font-size="13">2026-08-01 ~ 2026-08-10</text>

    <!-- 상태 배지: 기한초과 = 레드(color-danger) -->
    <rect x="948" y="436" width="102" height="28" rx="14" fill="#E5484D"/>
    <text x="999" y="455" text-anchor="middle" fill="#FFFFFF" class="mono bold700" font-size="12">기한초과</text>

    <text x="1000" y="500" fill="#111111" class="bold500" font-size="14" text-decoration="underline">수정</text>
    <text x="1050" y="500" fill="#E5484D" class="bold500" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- 카드 4: 시작 전 -->
  <g>
    <rect x="48" y="532" width="1104" height="104" rx="8" fill="#FAF6EE" stroke="#111111" stroke-width="2"/>
    <rect x="72" y="568" width="24" height="24" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="112" y="572" fill="#111111" class="bold700" font-size="18">다음 학기 수강신청</text>
    <rect x="112" y="584" width="72" height="22" rx="11" fill="none" stroke="#6B6558" stroke-width="1.5"/>
    <text x="148" y="599" text-anchor="middle" fill="#6B6558" class="bold500" font-size="12">학교 과제</text>
    <text x="112" y="624" fill="#6B6558" class="mono" font-size="13">2026-09-01 ~ 2026-09-05</text>

    <!-- 상태 배지: 시작 전 = 뮤트 그레이(color-muted) -->
    <rect x="954" y="560" width="96" height="28" rx="14" fill="#6B6558"/>
    <text x="1002" y="579" text-anchor="middle" fill="#FFFFFF" class="mono bold700" font-size="12">시작 전</text>

    <text x="1000" y="624" fill="#111111" class="bold500" font-size="14" text-decoration="underline">수정</text>
    <text x="1050" y="624" fill="#E5484D" class="bold500" font-size="14" text-decoration="underline">삭제</text>
  </g>

  <!-- ===== 하단 유틸리티 바 (스타일 4절, 선택 요소) ===== -->
  <rect x="0" y="880" width="1200" height="40" fill="#111111"/>
  <text x="600" y="905" text-anchor="middle" fill="#FFFFFF" class="mono bold500" font-size="12">4개의 할일 표시 중 · 필터: 전체 · 정렬: 시작일자순</text>
</svg>
